[project]
name = "lunar-backend"
version = "1.0.0"
description = "Backend para el simulador de iluminación solar y visibilidad de la Tierra en sitios de aterrizaje lunar"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "spiceypy>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "numba>=0.60",
  "rasterio>=1.3.10",
  "pyproj>=3.6",
  "httpx>=0.27",
  "tenacity>=8.2",
  "orjson>=3.10",
  "pillow>=10.0",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
jobs = ["arq>=0.26", "redis>=5.0"]
metrics = ["prometheus-fastapi-instrumentator>=7.0"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.100",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "skyfield>=1.48",
  "rio-cogeo>=5.0",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "network: requiere Internet (Horizons, PGDA, NAIF)",
  "data: requiere los datos reales descargados (kernels/DEM)",
  "slow: prueba lenta (> 5 s)",
  "benchmark: prueba de rendimiento",
]
addopts = '-m "not network and not data and not slow" --cov=app --cov=pipeline --cov-report=term-missing --cov-fail-under=85'

[tool.coverage.run]
branch = false
source = ["app", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "NPY", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "spiceypy.*",
  "rasterio.*",
  "numba.*",
  "scipy.*",
  "skyfield.*",
  "tqdm.*",
  "orjson.*",
  "rio_cogeo.*",
]
ignore_missing_imports = true
