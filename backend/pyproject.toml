[project]
name = "lunar-landing-backend"
version = "0.1.0"
description = "Lunar Landing Site Navigator - Motor de cálculo y API"
requires-python = ">=3.10"
dependencies = [
    "spiceypy>=6.0",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "scipy>=1.11",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
